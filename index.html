<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">

<title>三国典故 · 马原四十问</title>
<style>
  :root{
    --paper:#f4ecdb; --paper2:#ece0c6; --card:#fbf7ec;
    --ink:#2b231b; --ink-soft:#63533f; --line:#cdbb96; --line-soft:#e2d5b8;
    --red:#9c2b25; --red-dark:#7d1f1a; --gold:#a8803a;
    --ok:#3f6b3a; --ok-bg:#e9f0e1; --ok-line:#9bb98a;
    --bad:#9c2b25; --bad-bg:#f5e2df; --bad-line:#cfa39d;
    --kaiti:"KaiTi","楷体","STKaiti","Kaiti SC","Songti SC","SimSun","宋体",serif;
    --songti:"SimSun","宋体","Songti SC","STSong",serif;
    --hei:"SimHei","黑体","Heiti SC","Microsoft YaHei",sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:var(--kaiti);
    color:var(--ink);
    background:
      radial-gradient(circle at 18% 12%, rgba(255,255,255,.55), rgba(255,255,255,0) 42%),
      radial-gradient(circle at 82% 88%, rgba(168,128,58,.10), rgba(168,128,58,0) 46%),
      repeating-linear-gradient(0deg, rgba(140,110,60,.035) 0 1px, rgba(140,110,60,0) 1px 4px),
      repeating-linear-gradient(90deg, rgba(140,110,60,.030) 0 1px, rgba(140,110,60,0) 1px 5px),
      linear-gradient(160deg, var(--paper) 0%, var(--paper2) 100%);
    background-attachment:fixed;
    min-height:100vh; padding:22px 14px 60px;
    font-size:17px; line-height:1.9;
    -webkit-text-size-adjust:100%;
  }
  .wrap{max-width:820px;margin:0 auto;}

  /* 顶部 */
  header{display:flex;align-items:center;gap:14px;margin-bottom:14px;}
  .seal{
    flex:0 0 auto;width:56px;height:56px;border:2px solid var(--red);
    border-radius:6px;color:var(--red);display:flex;align-items:center;justify-content:center;
    font-family:var(--hei);font-weight:700;font-size:19px;line-height:1.05;letter-spacing:1px;
    background:rgba(156,43,37,.05);box-shadow:inset 0 0 0 3px rgba(156,43,37,.10);
  }
  .head-text h1{margin:0;font-size:23px;letter-spacing:2px;color:var(--ink);}
  .head-text p{margin:2px 0 0;color:var(--ink-soft);font-size:13.5px;letter-spacing:.5px;}

  /* 进度 */
  .bar-row{display:flex;align-items:center;gap:12px;margin:0 0 14px;}
  .counter{font-family:var(--hei);font-size:13.5px;color:var(--red);white-space:nowrap;letter-spacing:1px;}
  .bar{flex:1;height:8px;border:1px solid var(--line);border-radius:99px;background:rgba(255,255,255,.5);overflow:hidden;}
  .bar > i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--gold),var(--red));transition:width .35s ease;}

  /* 卡片（卷轴） */
  .scroll{
    position:relative;background:var(--card);border:1px solid var(--line);
    border-radius:10px;padding:26px 26px 22px;
    box-shadow:0 10px 26px rgba(80,60,25,.12), inset 0 0 0 1px rgba(255,255,255,.6);
  }
  .scroll::before,.scroll::after{
    content:"";position:absolute;left:16px;right:16px;height:3px;border-radius:2px;
    background:linear-gradient(90deg,transparent,rgba(168,128,58,.55),transparent);
  }
  .scroll::before{top:8px;} .scroll::after{bottom:8px;}

  .tags{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px;}
  .tag{font-family:var(--hei);font-size:12px;letter-spacing:.5px;padding:2px 10px;border-radius:99px;
    border:1px solid var(--line);color:var(--ink-soft);background:rgba(255,255,255,.55);}
  .tag.k{color:var(--red-dark);border-color:var(--red);background:rgba(156,43,37,.06);}

  .stem{font-size:18px;line-height:2.0;}
  .stem .mark{color:var(--red);font-weight:700;}

  /* 选项 */
  .opts{list-style:none;margin:16px 0 0;padding:0;display:flex;flex-direction:column;gap:10px;}
  .opt{
    display:flex;gap:12px;align-items:flex-start;
    border:1px solid var(--line-soft);border-radius:8px;background:rgba(255,255,255,.62);
    padding:11px 14px;cursor:pointer;transition:.16s;user-select:none;
  }
  .opt .lab{font-family:var(--hei);font-weight:700;color:var(--red);flex:0 0 1.2em;text-align:center;}
  .opt .txt{flex:1;}
  .opt:hover{border-color:var(--gold);background:#fffdf6;transform:translateX(2px);}
  .opt.locked{cursor:default;transform:none;}
  .opt.ok{border-color:var(--ok-line);background:var(--ok-bg);}
  .opt.bad{border-color:var(--bad-line);background:var(--bad-bg);}
  .opt.ok .lab,.opt.bad .lab{color:inherit;}
  .opt .mark{font-family:var(--hei);font-size:13px;margin-left:6px;white-space:nowrap;}
  .opt.ok .mark{color:var(--ok);} .opt.bad .mark{color:var(--bad);}

  /* 解析区 */
  .reveal{margin-top:18px;display:none;animation:fade .3s ease;}
  .reveal.show{display:block;}
  @keyframes fade{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:none;}}
  .verdict{font-family:var(--hei);font-size:15px;letter-spacing:.5px;margin-bottom:12px;}
  .verdict .yes{color:var(--ok);} .verdict .no{color:var(--bad);}
  .block{border-top:1px dashed var(--line);padding:11px 0 3px;}
  .block:first-of-type{border-top:0;}
  .block h4{margin:0 0 4px;font-family:var(--hei);font-size:13px;letter-spacing:2px;color:var(--red-dark);}
  .block h4 span{display:inline-block;border-left:3px solid var(--red);padding-left:7px;}
  .block p{margin:0;color:var(--ink);font-size:16px;line-height:1.95;}
  .block p.muted{color:var(--ink-soft);}

  /* 按钮 */
  .foot{display:flex;justify-content:flex-end;gap:12px;margin-top:20px;}
  button{
    font-family:var(--hei);font-size:15px;letter-spacing:1px;cursor:pointer;
    border-radius:8px;padding:10px 26px;transition:.16s;border:1px solid var(--red);
  }
  .btn-main{background:var(--red);color:#fdf6e8;box-shadow:0 3px 0 var(--red-dark);}
  .btn-main:hover{background:var(--red-dark);}
  .btn-main:active{transform:translateY(2px);box-shadow:0 1px 0 var(--red-dark);}
  .btn-main[disabled]{opacity:.35;cursor:not-allowed;box-shadow:none;}
  .btn-ghost{background:transparent;color:var(--red);}
  .btn-ghost:hover{background:rgba(156,43,37,.08);}

  /* 结算 */
  .result{text-align:center;padding:16px 6px 6px;}
  .result .score{font-family:var(--hei);font-size:52px;color:var(--red);letter-spacing:2px;line-height:1.2;}
  .result .score small{font-size:20px;color:var(--ink-soft);}
  .result .rank{margin:8px 0 6px;font-size:20px;letter-spacing:3px;color:var(--gold);}
  .result .note{color:var(--ink-soft);font-size:15px;}
  .result .foot{justify-content:center;}
  .hint{color:var(--ink-soft);font-size:13px;margin-top:14px;text-align:center;letter-spacing:.5px;}

  @media (max-width:560px){
    body{font-size:16px;padding:16px 10px 48px;}
    .scroll{padding:20px 16px 16px;}
    .stem{font-size:17px;}
    .head-text h1{font-size:19px;}
    .seal{width:48px;height:48px;font-size:16px;}
    .result .score{font-size:44px;}
  }
</style>

  {"id": 11, "chapter": "第一章第二节", "point": "矛盾的同一性与斗争性及其相互联结", "stem": "赤壁之战时孙刘联合抗曹，战后又因荆州归属频频交恶，直至刀兵相见。这种“既联合又争夺”的关系说明（　）。", "options": {"A": "有同一性就排斥斗争性", "B": "同一性就是斗争性，二者没有区别", "C": "矛盾的同一性和斗争性相互联结、不可分割", "D": "矛盾双方只有斗争，没有同一"}, "answer": "C", "analysis": "联合（同一性）与争夺（斗争性）同时存在、互为前提，正是矛盾同一性和斗争性相互联结的体现。B 混淆二者；A、D 割裂或否认同一性与斗争性，均错。", "story": "208 年孙刘联军于赤壁大败曹操；战后因荆州归属，孙权、刘备由盟转敌，关羽失荆州、夷陵之战皆由此而起。", "people": "孙权（182—252），字仲谋，东吴开国皇帝；刘备（161—223）。"},
  {"id": 12, "chapter": "第一章第二节", "point": "矛盾的特殊性（具体问题具体分析）", "stem": "南中叛乱，诸葛亮对孟获“七擒七纵”，以攻心代替单纯的武力镇压，终使其心服。这一做法体现的方法论是（　）。", "options": {"A": "承认了矛盾的普遍性就等于解决了矛盾", "B": "一切矛盾都只能用武力解决", "C": "矛盾的特殊性寓于普遍性之中，故无须区别对待", "D": "具体问题具体分析，用不同方法解决不同性质的矛盾"}, "answer": "D", "analysis": "南中问题的特殊性在于“攻心”胜于“攻城”，诸葛亮据此采取“擒纵并用”之策，正是具体分析矛盾特殊性、对症下药。B 绝对化；C 恰好说反；A 以普遍性代替具体分析，错误。", "story": "“七擒孟获”见《三国志》裴松之注引《汉晋春秋》：诸葛亮对南中首领孟获屡擒屡纵，使其心服，南中遂定。", "people": "诸葛亮（181—234）；孟获，南中地区少数民族首领。"},
  {"id": 13, "chapter": "第一章第二节", "point": "质量互变规律", "stem": "司马懿在曹魏后期长期称病韬晦、暗中积蓄力量，一旦时机到来便发动高平陵之变，夺取朝政大权。这一过程所含的规律是（　）。", "options": {"A": "质变不需要量变的准备即可发生", "B": "量变积累到一定程度必然引起质变", "C": "量变就是质变，二者没有区别", "D": "事物只有量变，没有质变"}, "answer": "B", "analysis": "长期韬晦、培植势力是量的积累，时机成熟后一举夺权是质的飞跃，体现量变到质变的规律。A 否认量变是质变的前提；C、D 混淆或否认二者的区别。", "story": "高平陵之变（249 年）：司马懿趁曹爽陪同皇帝出城祭扫高平陵之机发动政变，诛曹爽，从此司马氏独揽曹魏大权。", "people": "司马懿（179—251），字仲达，曹魏重臣，西晋奠基者。"},
  {"id": 14, "chapter": "第一章第二节", "point": "否定之否定规律（前进性与曲折性的统一）", "stem": "《三国演义》开篇说“话说天下大势，分久必合，合久必分”。用唯物辩证法衡量，这句话的局限在于（　）。", "options": {"A": "它把社会发展看成一个封闭的圆圈，陷入循环论，未揭示前进性与曲折性的统一", "B": "它承认了事物的发展变化", "C": "它否定了历史发展有任何规律", "D": "它指出了矛盾是事物发展的动力"}, "answer": "A", "analysis": "否定之否定不是回到原点的循环，而是螺旋式上升、前进性与曲折性相统一。“分久必合、合久必分”把历史看成简单往复，故 A 正确。B、D 是句子的合理之处而非“局限”；C 与句意不符。", "story": "此语出自《三国演义》第一回开篇，是一种文学化的历史概括，并非严格的哲学命题。", "people": "罗贯中（约 1330—约 1400），元末明初小说家，《三国演义》作者。"},
  {"id": 15, "chapter": "第一章第二节", "point": "现象与本质（透过现象看本质）", "stem": "《演义》写街亭失守后，诸葛亮以空城抚琴退司马懿之兵。司马懿只见“城门大开、孔明端坐”的表象，未究其实，遂引兵而退。这一情节说明（　）。", "options": {"A": "现象表现本质，必须透过现象把握本质，防止被假象迷惑", "B": "现象就是本质，看到现象即认识了本质", "C": "假象不是对本质的歪曲表现，与本质无关", "D": "人的认识不会产生错觉与失误"}, "answer": "A", "analysis": "司马懿被“空城端坐”的假象所迷惑，未能透过现象看本质，正是 A 的注脚。B 把现象等同于本质；C 否认假象也是本质（歪曲）的表现；D 绝对化。", "story": "“空城计”是《三国演义》第九十五回的虚构情节，正史无载，街亭之败后诸葛亮并未施行此计。", "people": "诸葛亮（181—234）；司马懿（179—251）。"},
  {"id": 16, "chapter": "第一章第二节", "point": "必然性与偶然性的辩证统一", "stem": "关羽北伐、水淹七军，威震华夏，却因后方空虚、糜芳士仁叛迎孙权而失荆州。用辩证法看，关羽之败说明（　）。", "options": {"A": "偶然性可以脱离必然性而单独起作用", "B": "偶然性背后隐藏着必然性，偶然是必然的表现和补充", "C": "历史事件纯粹由偶然的意外决定", "D": "必然是偶然的简单相加"}, "answer": "B", "analysis": "糜芳、士仁叛变看似偶然，但关羽轻敌骄矜、与同僚不和、后方空虚，已含导致失败的必然趋势，偶然的叛变正是这一必然的体现和补充。A、C 割裂二者；D 把必然说成偶然的相加，错误。", "story": "219 年关羽发动襄樊之战，水淹七军，兵锋甚盛，但为吕蒙、陆逊偷袭后方，糜芳、士仁不战而降，关羽败走麦城被杀，荆州失陷。", "people": "关羽（？—220）；糜芳、士仁，原蜀汉将领，后降吴。"},

  {"id": 18, "chapter": "第一章第二节", "point": "可能与现实（现实的可能性与抽象的可能性）", "stem": "蜀汉已亡、成都已降，姜维仍诈降钟会、密谋复国，终与钟会同死于乱军。从“可能与现实”的角度看，姜维所谋属于（　）。", "options": {"A": "抽象的可能性，因缺乏必要的客观条件而无法转化为现实", "B": "现实的可能性，只待时机成熟", "C": "已经完全变成现实的方案", "D": "与条件毫无关系的纯粹空想，不具备任何可能性"}, "answer": "A", "analysis": "姜维的方案看似合理，却缺少军队、人心、魏将支持等必要条件，故只是抽象的可能性；现实的可能性才有充分根据、在当下可以实现。故选 A。B 高估条件；C 与失败的事实不符；D 走另一极端——抽象的可能仍是可能，只是不能实现。", "story": "263 年蜀汉灭亡后，姜维诈降魏将钟会，劝其据蜀反魏，欲乘乱复国，事败，与钟会同被杀。见《三国志·姜维传》。", "people": "姜维（202—264），字伯约，蜀汉大将军；钟会（225—264），曹魏将领。"},

  {"id": 23, "chapter": "第二章第一节", "point": "实践是认识发展的动力", "stem": "诸葛亮在与曹魏、孙吴的长期交锋中，不断改进阵法与器械（如八阵图、连弩），其军事认识也随之深化。这说明（　）。", "options": {"A": "认识的发展与人的实践活动无关", "B": "认识一旦形成便不再变化", "C": "实践不断提出新问题、提供新经验，推动认识向前发展", "D": "认识的发展只靠天才的灵感"}, "answer": "C", "analysis": "战争实践不断暴露新问题、积累新经验，促使诸葛亮改进战法、深化认识，体现实践是认识发展的动力。A、B、D 或否认发展，或割裂实践与认识，或陷入天才论，均错。", "story": "诸葛亮治军注重阵法与器械：“八阵图”见于记载并有遗迹传说，“损益连弩”亦为蜀汉所重。", "people": "诸葛亮（181—234）。"},

  {"id": 30, "chapter": "第二章第二节", "point": "真理的绝对性与相对性的统一", "stem": "《演义》把诸葛亮写成能“掐算”天机的神人。若从认识论看，他对天象、气候的把握在当时条件下既有可靠内容，又受时代局限。这说明真理是（　）。", "options": {"A": "绝对性与相对性的统一", "B": "纯粹相对的，没有客观内容", "C": "纯粹绝对的，已经穷尽一切", "D": "主观的，取决于是否合人心意"}, "answer": "A", "analysis": "一方面它包含与客观相符合的内容（绝对性），另一方面又受历史条件制约、有待扩展（相对性），故真理是绝对性与相对性的统一。B、C 各执一端；D 否认真理的客观性。", "story": "《演义》中诸葛亮常以观星、借风等情节被神化；这些是文学夸张，其真实知识来自对天文、地理的学习与实践。", "people": "诸葛亮（181—234）。"},

          '<span class="tag">' + esc(q.chapter) + '</span>' +
          '<span class="tag k">' + esc(q.point) + '</span>' +
        '</div>' +
        '<div class="stem">' + esc(q.stem) + '</div>' +
        '<ul class="opts" id="opts">' + opts + '</ul>' +
        '<div class="reveal" id="reveal"></div>' +
        '<div class="foot">' +
          '<button class="btn-main" id="next" disabled>下一题</button>' +
        '</div>' +
      '</section>';

    document.getElementById('opts').addEventListener('click', onPick);
    document.getElementById('next').addEventListener('click', onNext);
  }

  function onPick(e){
    var li = e.target.closest('.opt');
    if(!li || answered) return;
    answered = true;

    var chosen = li.getAttribute('data-k');
    var q = BANK[idx];
    var correct = q.answer;
    var ok = (chosen === correct);
    if(ok) score++;

    var items = stage.querySelectorAll('.opt');
    items.forEach(function(el){
      el.classList.add('locked');
      var k = el.getAttribute('data-k');
      if(k === correct){
        el.classList.add('ok');
        el.querySelector('.txt').insertAdjacentHTML('beforeend',
          '<span class="mark">✔ 正确答案</span>');
      }
      if(k === chosen && !ok){
        el.classList.add('bad');
        el.querySelector('.txt').insertAdjacentHTML('beforeend',
          '<span class="mark">✘ 你选了这个</span>');
      }
    });

    var reveal = document.getElementById('reveal');
    reveal.innerHTML =
      '<div class="verdict">' + (ok
        ? '<span class="yes">✓ 答对了　' : '<span class="no">✗ 答错了　') +
        '正确答案：' + correct + '</span></div>' +
      '<div class="block"><h4><span>解析</span></h4><p>' + esc(q.analysis) + '</p></div>' +
      '<div class="block"><h4><span>故事简介</span></h4><p>' + esc(q.story) + '</p></div>' +
      '<div class="block"><h4><span>人物简介</span></h4><p class="muted">' + esc(q.people) + '</p></div>';
    reveal.classList.add('show');

    document.getElementById('next').disabled = false;
    document.getElementById('next').textContent = (idx === TOTAL - 1) ? '查看成绩' : '下一题';
    barFill.style.width = ((idx + 1) / TOTAL * 100) + '%';
  }

  function onNext(){
    if(idx < TOTAL - 1){
      idx++;
      renderQuestion();
      window.scrollTo({top:0, behavior:'smooth'});
    } else {
      renderResult();
    }
  }

  function renderResult(){
    hint.style.display = 'none';
    counter.textContent = '已完成';
    barFill.style.width = '100%';
    var pct = score / TOTAL;
    var rank, note;
    if(pct >= 0.9){ rank = '通晓古今'; note = '马原一二章掌握得很扎实，堪称“卧龙之才”。'; }
    else if(pct >= 0.75){ rank = '运筹帷幄'; note = '整体不错，个别知识点再巩固一下就更稳了。'; }
    else if(pct >= 0.6){ rank = '渐入佳境'; note = '基础尚可，建议对照教材回看错题涉及的知识点。'; }
    else { rank = '尚需用功'; note = '别急，把第一、二章的框架理一遍，再来一轮会好很多。'; }

    stage.innerHTML =
      '<section class="scroll"><div class="result">' +
        '<div class="score">' + score + '<small> / ' + TOTAL + '</small></div>' +
        '<div class="rank">' + rank + '</div>' +
        '<p class="note">' + note + '</p>' +
        '<div class="foot"><button class="btn-main" id="again">再来一轮</button></div>' +
      '</div></section>';
    document.getElementById('again').addEventListener('click', function(){
      idx = 0; score = 0; answered = false;
      renderQuestion();
      window.scrollTo({top:0, behavior:'smooth'});
    });
  }

  renderQuestion();
})();
</script>
</body>
</html>
